name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: health-check
  IMAGE: ghcr.io/zhassulan1/health-check

jobs:
  # Build and test Go application
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...


    - name: Generate HTML coverage report
      run: go tool cover -html=coverage.txt -o coverage.html


    - name: Upload coverage reports as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-coverage-reports
        path: |
          coverage.txt
          coverage.html
        retention-days: 30

    - name: Build application
      run: |
        CGO_ENABLED=0 go build -ldflags="-w -s" -o main.out ./cmd/

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: health-check-binary
        path: main.out
        retention-days: 7

  # Build Docker image
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: |
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true
        labels: |
          org.opencontainers.image.source=https://github.com/Zhassulan1/Secure-Container

    - name: Test Docker image
      run: |
        # Same restrictions as docker-compose.yml; fail unless the healthcheck passes
        docker run -d --name test-container -p 8080:8080 \
          --cap-drop ALL --security-opt no-new-privileges \
          --tmpfs /tmp:mode=1777 --pids-limit 1024 \
          --health-interval 2s --health-start-period 2s \
          ${{ env.IMAGE_NAME }}:latest
        for _ in $(seq 1 30); do
          health=$(docker inspect -f '{{.State.Health.Status}}' test-container)
          [ "$health" = "healthy" ] && break
          sleep 2
        done
        docker inspect -f '{{json .State.Health}}' test-container
        curl -fsS http://localhost:8080/check
        docker rm -f test-container
        [ "$health" = "healthy" ]

    - name: Export Docker image
      run: |
        docker save ${{ env.IMAGE_NAME }}:latest -o health-check-image.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: health-check-image.tar
        retention-days: 7

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    permissions:
      contents: read
      security-events: write
      actions: read

    env:
      # Trivy 0.76.1, pinned by digest
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: ${{ runner.temp }}/image

    - name: Run Trivy scans
      run: |
        trivy() {
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/image:/image:ro" \
            -v "$RUNNER_TEMP/reports:/reports" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" "$@"
        }
        mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/trivy-cache"
        # Built image: alpine packages and the Go binary
        trivy image --input /image/health-check-image.tar --severity CRITICAL,HIGH --format sarif --output /reports/trivy-image.sarif
        trivy image --input /image/health-check-image.tar --severity CRITICAL,HIGH --format json --output /reports/trivy-image.json
        # Repository: go.mod dependencies and committed secrets
        trivy fs --severity CRITICAL,HIGH --format sarif --output /reports/trivy-fs.sarif /src
        trivy fs --severity CRITICAL,HIGH --format json --output /reports/trivy-fs.json /src
        # fail on fixable CRITICAL/HIGH
        trivy image --input /image/health-check-image.tar --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table
        trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table /src

    - name: Upload Trivy image results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: ${{ runner.temp }}/reports/trivy-image.sarif
        category: 'trivy-image'

    - name: Upload Trivy repository results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: ${{ runner.temp }}/reports/trivy-fs.sarif
        category: 'trivy'

    - name: Upload Trivy reports as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-security-reports
        path: ${{ runner.temp }}/reports/
        retention-days: 30

  # Semgrep SAST scanning
  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      security-events: write
      actions: read

    # Skip Dependabot PRs
    if: (github.actor != 'dependabot[bot]')

    container:
      image: semgrep/semgrep

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep scan (multiple formats)
      run: |
        semgrep scan --config auto --sarif --output=semgrep.sarif
        semgrep scan --config auto --json --output=semgrep.json


    - name: Upload Semgrep results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: semgrep.sarif
        category: 'semgrep'


    - name: Upload Semgrep reports as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: semgrep-security-reports
        path: |
          semgrep.sarif
          semgrep.json
        retention-days: 30

  # SonarCloud SAST analysis
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: build-and-test
    # no SONAR_TOKEN on dependabot and fork PRs
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: test-coverage-reports
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Push image to GHCR
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan, semgrep-sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: ${{ runner.temp }}/image

    - name: Log in to GHCR
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push image
      run: |
        docker load -i "$RUNNER_TEMP/image/health-check-image.tar"
        docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE }}:latest
        docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE }}:${{ github.sha }}
        docker push ${{ env.IMAGE }}:latest
        docker push ${{ env.IMAGE }}:${{ github.sha }}
